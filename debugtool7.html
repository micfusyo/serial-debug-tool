<!DOCTYPE html>
<html lang="zh-TW" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <title>網頁版串口調試工具</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <style>
        :root[data-theme="light"] {
            --bg-color: #ffffff;
            --text-color: #333333;
            --textarea-bg: #f5f5f5;
            --textarea-border: #cccccc;
            --button-bg: #4CAF50;
            --button-text: white;
            --theme-icon: "🌙";
            --icon-size: 24px;
        }

        :root[data-theme="dark"] {
            --bg-color: #1a1a1a;
            --text-color: #ffffff;
            --textarea-bg: #2d2d2d;
            --textarea-border: #404040;
            --button-bg: #45a049;
            --button-text: white;
            --theme-icon: "☀️";
            --icon-size: 24px;
        }

        body {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            font-family: Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: all 0.3s ease;
        }

        .theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 8px;
            font-size: var(--icon-size);
            cursor: pointer;
            background: none;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.3s ease;
        }

        .theme-toggle:hover {
            transform: scale(1.1);
        }

        .theme-toggle::after {
            content: var(--theme-icon);
        }

        textarea {
            background-color: var(--textarea-bg);
            color: var(--text-color);
            border: 1px solid var(--textarea-border);
            padding: 10px;
            border-radius: 4px;
            width: 100%;
            box-sizing: border-box;
        }

        button {
            background-color: var(--button-bg);
            color: var(--button-text);
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            transition: opacity 0.3s ease;
        }

        button:hover {
            opacity: 0.9;
        }

        select {
            padding: 8px;
            border-radius: 4px;
            background-color: var(--textarea-bg);
            color: var(--text-color);
            border: 1px solid var(--textarea-border);
        }

        .container {
            display: grid;
            gap: 20px;
        }

        #receiveBox {
            height: 300px;
        }

        #sendBox {
            height: 100px;
        }

        .control-panel {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
        }

        .send-options {
            margin: 10px 0;
        }

        .send-options label {
            margin-right: 15px;
        }

        .hidden {
            display: none;
        }

        .main-container {
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: 20px;
            margin-top: 20px;
        }

        .groupbox {
            border: 1px solid var(--textarea-border);
            border-radius: 8px;
            padding: 15px;
            background-color: var(--bg-color);
        }

        .groupbox-title {
            font-size: 1.1em;
            margin-bottom: 15px;
            padding-bottom: 5px;
            border-bottom: 1px solid var(--textarea-border);
        }

        .quick-send-row {
            display: grid;
            grid-template-columns: 60px 1fr;
            gap: 5px;
            margin-bottom: 8px;
        }

        .quick-send-row button {
            width: 100%;
            padding: 4px 8px;
            font-size: 0.9em;
        }

        .quick-send-row input {
            width: 90%;
            padding: 4px 8px;
            font-size: 0.9em;
        }

        .quick-send-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        /* 調整原有元素的樣式 */
        #receiveBox, #sendBox {
            width: 100%;
            margin-bottom: 10px;
        }

        .help-icon {
            margin-left: 10px;
            color: #666;
            font-size: var(--icon-size);
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
        }

        .help-icon:hover {
            color: #333;
        }

        [data-theme="dark"] .help-icon {
            color: #ccc;
        }

        [data-theme="dark"] .help-icon:hover {
            color: #fff;
        }

        .slider-container {
        margin-top: 20px;
        padding-top: 10px;
        border-top: 1px solid var(--textarea-border);
        }

        .slider-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 10px 0;
        }

        input[type="range"] {
            flex: 1;
            height: 25px;
        }

        #sliderValue {
            min-width: 50px;
        }

        .file-operations {
            margin-top: 20px;
            padding-top: 10px;
            border-top: 1px solid var(--textarea-border);
            display: flex;
            gap: 10px;
        }

        .file-operations button {
            flex: 1;
        }

        .right-panel {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .modbus-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .modbus-settings, .modbus-address, .modbus-data {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        .modbus-container label {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .modbus-container input, .modbus-container select {
            padding: 5px;
            border-radius: 4px;
            border: 1px solid var(--textarea-border);
            background-color: var(--textarea-bg);
            color: var(--text-color);
        }

        #sendModbus {
            margin-top: 10px;
        }

        /* 頁籤容器樣式 */
        .tab-container {
            width: 100%;
        }

        .tab-buttons {
            display: flex;
            border-bottom: 1px solid var(--textarea-border);
            margin-bottom: 15px;
        }

        .tab-button {
            padding: 8px 16px;
            background: none;
            border: none;
            border-bottom: 2px solid transparent;
            color: var(--text-color);
            cursor: pointer;
            opacity: 0.7;
            transition: all 0.3s ease;
        }

        .tab-button:hover {
            opacity: 1;
        }

        .tab-button.active {
            border-bottom: 2px solid var(--button-bg);
            opacity: 1;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }
    </style>
</head>
<body>
    <button class="theme-toggle" id="themeToggle" title="切換主題"></button>
    <a href="help.html" class="help-icon" title="使用說明" style="position: fixed; top: 20px; right: 70px;">
        <i class="fas fa-question-circle"></i>
    </a>
    
    <!-- 添加標題 -->
    <h1 style="text-align: center; margin-bottom: 30px;">網頁版串口調試工具</h1>
    
    <div class="container">
        <div class="control-panel">
            <button id="connectButton">連接設備</button>
            <select id="baudRate">
                <option value="9600">9600</option>
                <option value="19200">19200</option>
                <option value="38400">38400</option>
                <option value="57600">57600</option>
                <option value="115200" selected>115200</option>
                <option value="230400">230400</option>
                <option value="921600">921600</option>
                <option value="2000000">2000000</option>
                <option value="4000000">4000000</option>
            </select>
            <button id="clearButton">清空全部</button>
        </div>

        <div class="main-container">
            <!-- 左側群組 -->
            <div class="groupbox">
                <div class="groupbox-title">數據收發</div>
                <div>
                    <h3>接收數據：</h3>
                    <div class="send-options">
                        <label>
                            <input type="radio" name="receiveFormat" value="text" checked> 文本
                        </label>
                        <label>
                            <input type="radio" name="receiveFormat" value="hex"> 16進位
                        </label>
                    </div>
                    <textarea id="receiveBox" readonly></textarea>
                </div>

                <div>
                    <h3>發送數據：</h3>
                    <div class="send-options">
                        <label>
                            <input type="radio" name="sendFormat" value="text" checked> 文本
                        </label>
                        <label>
                            <input type="radio" name="sendFormat" value="hex"> 16進位
                        </label>
                        <label style="margin-left: 15px;">
                            <input type="checkbox" id="autoNewline" checked> 自動換行
                        </label>
                    </div>
                    <textarea id="sendBox"></textarea>
                    <button id="sendButton">發送</button>
                </div>
            </div>

            <!-- 右側群組 -->
            <div class="right-panel">
                <div class="groupbox">
                    <div class="tab-container">
                        <!-- 頁籤按鈕 -->
                        <div class="tab-buttons">
                            <button class="tab-button active" data-tab="quicksend">快捷發送</button>
                            <button class="tab-button" data-tab="modbus">Modbus 操作</button>
                        </div>

                        <!-- 快捷發送頁面 -->
                        <div class="tab-content active" id="quicksend-tab">
                            <div id="quickSendContainer">
                                <!-- F1-F30 按鈕和輸入框將通過 JavaScript 動態生成 -->
                            </div>
                            <div class="file-operations">
                                <button id="saveToFile">保存快捷文字</button>
                                <button id="loadFromFile">讀取快捷文字</button>
                            </div>
                        </div>

                        <!-- Modbus 操作頁面 -->
                        <div class="tab-content" id="modbus-tab">
                            <div class="modbus-container">
                                <div class="modbus-settings">
                                    <label>
                                        從站地址:
                                        <input type="number" id="slaveAddress" min="1" max="247" value="1">
                                    </label>
                                    <label>
                                        功能碼:
                                        <select id="functionCode">
                                            <option value="1">01 - 讀取線圈</option>
                                            <option value="2">02 - 讀取離散輸入</option>
                                            <option value="3">03 - 讀取保持寄存器</option>
                                            <option value="4">04 - 讀取輸入寄存器</option>
                                            <option value="5">05 - 寫入單個線圈</option>
                                            <option value="6">06 - 寫入單個寄存器</option>
                                            <option value="15">15 - 寫入多個線圈</option>
                                            <option value="16">16 - 寫入多個寄存器</option>
                                        </select>
                                    </label>
                                </div>
                                <div class="modbus-address">
                                    <label>
                                        起始地址:
                                        <input type="number" id="startAddress" min="0" max="65535" value="0">
                                    </label>
                                    <label>
                                        數量:
                                        <input type="number" id="quantity" min="1" max="125" value="1">
                                    </label>
                                </div>
                                <div class="modbus-data">
                                    <label>
                                        數據值:
                                        <input type="text" id="modbusData" placeholder="多個值用逗號分隔">
                                    </label>
                                </div>
                                <button id="sendModbus">發送 Modbus 命令</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        
        // 保存快捷文字到文件
        document.getElementById('saveToFile').addEventListener('click', () => {
            const quickTexts = {};
            for (let i = 1; i <= 30; i++) {
                const input = document.getElementById(`quickText${i}`);
                quickTexts[`F${i}`] = input.value;
            }

            const blob = new Blob([JSON.stringify(quickTexts, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'quick_send_texts.json';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        });

        // 從文件讀取快捷文字
        document.getElementById('loadFromFile').addEventListener('click', () => {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json';
            
            input.onchange = (e) => {
                const file = e.target.files[0];
                const reader = new FileReader();
                
                reader.onload = (event) => {
                    try {
                        const quickTexts = JSON.parse(event.target.result);
                        for (let i = 1; i <= 30; i++) {
                            const input = document.getElementById(`quickText${i}`);
                            const value = quickTexts[`F${i}`] || '';
                            input.value = value;
                            localStorage.setItem(`quickText${i}`, value);
                        }
                        alert('快捷文字已成功載入！');
                    } catch (error) {
                        alert('文件格式錯誤！');
                        console.error('讀取錯誤:', error);
                    }
                };
                
                reader.readAsText(file);
            };
            
            input.click();
        });

        // 添加主題切換功能
        function toggleTheme() {
            const html = document.documentElement;
            const currentTheme = html.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            html.setAttribute('data-theme', newTheme);
            
            // 保存主題偏好到本地存儲
            localStorage.setItem('theme', newTheme);
        }

        // 初始化主題
        function initTheme() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme) {
                document.documentElement.setAttribute('data-theme', savedTheme);
            } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                // 如果用戶系統設置為暗色模式，則默認使用暗色主題
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        }

        // 頁面加載時初始化主題
        initTheme();

        // 添加主題切換按鈕事件監聽器
        document.getElementById('themeToggle').addEventListener('click', toggleTheme);

        let port = null;
        let reader = null;
        let keepReading = false;

        async function connectSerial() {
            try {
                port = await navigator.serial.requestPort();
                await port.open({ 
                    baudRate: parseInt(document.getElementById('baudRate').value) 
                });

                keepReading = true;
                reader = port.readable.getReader();
                
                document.getElementById('connectButton').textContent = '已連接';
                readSerialData();
            } catch (error) {
                console.error('連接錯誤:', error);
            }
        }

        // 新增：16進位字符串轉換為 Uint8Array
        function hexToBytes(hex) {
            hex = hex.replace(/\s+/g, ''); // 移除所有空格
            if (hex.length % 2 !== 0) {
                alert('16進位數據格式錯誤！');
                return null;
            }
            const bytes = new Uint8Array(hex.length / 2);
            for (let i = 0; i < hex.length; i += 2) {
                const byte = parseInt(hex.substr(i, 2), 16);
                if (isNaN(byte)) {
                    alert('無效的16進位數據！');
                    return null;
                }
                bytes[i/2] = byte;
            }
            return bytes;
        }

        // 新增：將接收到的數據轉換為16進位顯示
        function bytesToHex(bytes) {
            return Array.from(bytes)
                .map(byte => byte.toString(16).padStart(2, '0'))
                .join(' ');
        }

        // 更新：讀取串口數據的函數
        async function readSerialData() {
            while (port && keepReading) {
                try {
                    const { value, done } = await reader.read();
                    if (done) break;
                    
                    const receiveFormat = document.querySelector('input[name="receiveFormat"]:checked').value;
                    let displayText;
                    
                    if (receiveFormat === 'text') {
                        displayText = new TextDecoder().decode(value);
                    } else {
                        displayText = bytesToHex(value) + ' ';
                    }
                    
                    document.getElementById('receiveBox').value += displayText;
                    // 自動滾動到底部
                    const receiveBox = document.getElementById('receiveBox');
                    receiveBox.scrollTop = receiveBox.scrollHeight;
                } catch (error) {
                    console.error('讀取錯誤:', error);
                    break;
                }
            }
        }

        // 更新：發送數據的函數
        async function sendData() {
            if (!port) {
                alert('請先連接設備！');
                return;
            }

            let data = document.getElementById('sendBox').value;
            if (!data) return;

            const sendFormat = document.querySelector('input[name="sendFormat"]:checked').value;
            
            if (document.getElementById('autoNewline').checked) {
                data += '\r\n';
            }
            
            let bytes;
            if (sendFormat === 'text') {
                bytes = new TextEncoder().encode(data);
            } else {
                bytes = hexToBytes(data);
                if (!bytes) return;
            }

            try {
                const writer = port.writable.getWriter();
                await writer.write(bytes);
                writer.releaseLock();
            } catch (error) {
                console.error('發送錯誤:', error);
                alert('發送失敗！');
            }
        }

        document.getElementById('connectButton').addEventListener('click', connectSerial);
        document.getElementById('sendButton').addEventListener('click', sendData);
        document.getElementById('clearButton').addEventListener('click', () => {
            document.getElementById('receiveBox').value = '';
            document.getElementById('sendBox').value = '';
        });

        // 修改快捷發送按鈕生成函數
        function createQuickSendButtons() {
            const container = document.getElementById('quickSendContainer');
            container.className = 'quick-send-container';  // 添加新的 class
            
            // 創建左右兩個容器
            const leftColumn = document.createElement('div');
            const rightColumn = document.createElement('div');
            
            // 生成 30 個按鈕，平均分配到兩列
            for (let i = 1; i <= 30; i++) {
                const row = document.createElement('div');
                row.className = 'quick-send-row';

                const button = document.createElement('button');
                button.textContent = `F${i}`;
                button.id = `quickBtn${i}`;

                const input = document.createElement('input');
                input.type = 'text';
                input.id = `quickText${i}`;
                input.placeholder = `F${i}快捷文字`;

                // 從本地存儲加載保存的文字
                const savedText = localStorage.getItem(`quickText${i}`);
                if (savedText) {
                    input.value = savedText;
                }

                // 保存輸入的文字到本地存儲
                input.addEventListener('change', (e) => {
                    localStorage.setItem(`quickText${i}`, e.target.value);
                });

                // 點擊按鈕發送文字
                button.addEventListener('click', async () => {
                    const text = input.value;
                    if (!text) return;

                    if (!port) {
                        alert('請先連接設備！');
                        return;
                    }

                    try {
                        const writer = port.writable.getWriter();
                        const data = new TextEncoder().encode(text + (document.getElementById('autoNewline').checked ? '\r\n' : ''));
                        await writer.write(data);
                        writer.releaseLock();
                    } catch (error) {
                        console.error('發送錯誤:', error);
                        alert('發送失敗！');
                    }
                });

                row.appendChild(button);
                row.appendChild(input);

                // 將按鈕分配到左右兩列
                if (i <= 15) {
                    leftColumn.appendChild(row);
                } else {
                    rightColumn.appendChild(row);
                }
            }
            
            container.appendChild(leftColumn);
            container.appendChild(rightColumn);
        }

        // 頁面加載時創建快捷發送按鈕
        createQuickSendButtons();

        // Modbus CRC16 計算函數
        function calculateCRC16(data) {
            let crc = 0xFFFF;
            for (let i = 0; i < data.length; i++) {
                crc ^= data[i];
                for (let j = 0; j < 8; j++) {
                    if (crc & 0x0001) {
                        crc = (crc >> 1) ^ 0xA001;
                    } else {
                        crc = crc >> 1;
                    }
                }
            }
            return crc;
        }

        // 生成 Modbus RTU 命令
        function generateModbusCommand() {
            const slaveAddress = parseInt(document.getElementById('slaveAddress').value);
            const functionCode = parseInt(document.getElementById('functionCode').value);
            const startAddress = parseInt(document.getElementById('startAddress').value);
            const quantity = parseInt(document.getElementById('quantity').value);
            const data = document.getElementById('modbusData').value;

            let command = new Uint8Array(8);  // 基本命令長度
            command[0] = slaveAddress;
            command[1] = functionCode;
            command[2] = (startAddress >> 8) & 0xFF;  // 起始地址高字節
            command[3] = startAddress & 0xFF;         // 起始地址低字節

            // 根據功能碼處理不同的命令格式
            switch (functionCode) {
                case 1: case 2: case 3: case 4:  // 讀取命令
                    command[4] = (quantity >> 8) & 0xFF;
                    command[5] = quantity & 0xFF;
                    break;
                case 5:  // 寫入單個線圈
                    const coilValue = parseInt(data) ? 0xFF00 : 0x0000;
                    command[4] = (coilValue >> 8) & 0xFF;
                    command[5] = coilValue & 0xFF;
                    break;
                case 6:  // 寫入單個寄存器
                    const registerValue = parseInt(data);
                    command[4] = (registerValue >> 8) & 0xFF;
                    command[5] = registerValue & 0xFF;
                    break;
                case 15: case 16:  // 寫入多個值
                    const values = data.split(',').map(v => parseInt(v.trim()));
                    const byteCount = functionCode === 15 ? Math.ceil(quantity / 8) : quantity * 2;
                    command = new Uint8Array(7 + byteCount);
                    command[0] = slaveAddress;
                    command[1] = functionCode;
                    command[2] = (startAddress >> 8) & 0xFF;
                    command[3] = startAddress & 0xFF;
                    command[4] = (quantity >> 8) & 0xFF;
                    command[5] = quantity & 0xFF;
                    command[6] = byteCount;
                    
                    if (functionCode === 15) {  // 寫入多個線圈
                        let byteValue = 0;
                        for (let i = 0; i < quantity; i++) {
                            if (values[i]) {
                                byteValue |= (1 << (i % 8));
                            }
                            if ((i + 1) % 8 === 0 || i === quantity - 1) {
                                command[7 + Math.floor(i / 8)] = byteValue;
                                byteValue = 0;
                            }
                        }
                    } else {  // 寫入多個寄存器
                        for (let i = 0; i < quantity; i++) {
                            command[7 + i * 2] = (values[i] >> 8) & 0xFF;
                            command[7 + i * 2 + 1] = values[i] & 0xFF;
                        }
                    }
                    break;
            }

            // 計算並添加 CRC
            const crc = calculateCRC16(command.slice(0, -2));
            command[command.length - 2] = crc & 0xFF;
            command[command.length - 1] = (crc >> 8) & 0xFF;

            return command;
        }

        // 添加 Modbus 發送按鈕事件監聽器
        document.getElementById('sendModbus').addEventListener('click', async () => {
            if (!port) {
                alert('請先連接設備！');
                return;
            }

            try {
                const command = generateModbusCommand();
                const writer = port.writable.getWriter();
                await writer.write(command);
                writer.releaseLock();

                // 在接收框中顯示發送的命令
                const receiveBox = document.getElementById('receiveBox');
                receiveBox.value += `發送: ${Array.from(command).map(b => b.toString(16).padStart(2, '0')).join(' ')}\n`;
                receiveBox.scrollTop = receiveBox.scrollHeight;
            } catch (error) {
                console.error('Modbus 發送錯誤:', error);
                alert('發送失敗！');
            }
        });

        // 添加頁籤切換功能
        document.querySelectorAll('.tab-button').forEach(button => {
            button.addEventListener('click', () => {
                // 移除所有頁籤的 active 類
                document.querySelectorAll('.tab-button').forEach(btn => {
                    btn.classList.remove('active');
                });
                document.querySelectorAll('.tab-content').forEach(content => {
                    content.classList.remove('active');
                });

                // 添加當前頁籤的 active 類
                button.classList.add('active');
                const tabId = button.getAttribute('data-tab');
                document.getElementById(`${tabId}-tab`).classList.add('active');
            });
        });
    </script>
</body>
</html>
